# Type-checks the whole codebase. Runs separately so a type warning never blocks a deploy,
# but shows up as a red X on the commit so it gets fixed.
name: Checks

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
